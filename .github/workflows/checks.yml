name: Source and runtime checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check documentation and design tokens
        run: python -B scripts/verify_repository.py
      - name: Exercise original widgets and desktop browser
        run: python -X utf8 -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install the isolated build requirements
        run: |
          python -m venv work/build-env
          ./work/build-env/Scripts/python.exe -m pip install --disable-pip-version-check -r requirements-desktop-build.txt
      - name: Build both Windows runtime forms
        run: ./work/build-env/Scripts/python.exe -B scripts/build_desktop.py --output-dir work/v1.2.1/desktop-dist --version 1.2.1
      - name: Verify package resources and provenance
        run: ./work/build-env/Scripts/python.exe -B scripts/verify_desktop_package.py --portable-zip work/v1.2.1/desktop-dist/UI_Center_v1.2.1_Windows_x64_Portable.zip --single-exe work/v1.2.1/desktop-dist/UI_Center_v1.2.1_Windows_x64.exe --version 1.2.1 --source-commit ${{ github.sha }} --report work/v1.2.1/desktop-dist/verify-desktop-report.json
      - name: Run both frozen apps away from source paths
        shell: pwsh
        run: ./scripts/smoke_desktop.ps1 -DistDir work/v1.2.1/desktop-dist -ReportDir work/v1.2.1/desktop-smoke -Version 1.2.1 -SourceCommit ${{ github.sha }}
      - name: Stage verified runtime artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path work/v1.2.1/runtime-artifact | Out-Null
          Copy-Item -LiteralPath work/v1.2.1/desktop-dist/UI_Center_v1.2.1_Windows_x64_Portable.zip,work/v1.2.1/desktop-dist/UI_Center_v1.2.1_Windows_x64.exe,work/v1.2.1/desktop-dist/build-desktop-report.json,work/v1.2.1/desktop-dist/verify-desktop-report.json -Destination work/v1.2.1/runtime-artifact
          Copy-Item -Path work/v1.2.1/desktop-smoke/smoke-*.json -Destination work/v1.2.1/runtime-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-runtime-v1.2.1-${{ github.sha }}
          path: work/v1.2.1/runtime-artifact/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve failed frozen-build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-diagnostics-v1.2.1-${{ github.sha }}
          path: |
            work/v1.2.1/desktop-dist/*.zip
            work/v1.2.1/desktop-dist/*.exe
            work/v1.2.1/desktop-dist/*-report.json
            work/v1.2.1/desktop-smoke/*.json
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Build and lint the independent Android app and device test
        run: gradle -p examples/android --no-daemon --console=plain assembleDebug lintDebug assembleDebugAndroidTest
      - name: Verify packaged shared design tokens
        run: python3 -B scripts/verify_android_asset.py
      - name: Check task lifecycle without an Android runtime
        run: |
          mkdir -p work/ci-state
          javac -encoding UTF-8 -d work/ci-state components/android/src/main/java/cn/local/uicenter/TaskState.java tests/android/TaskStateTest.java
          java -cp work/ci-state TaskStateTest

  release:
    name: Publish approved v1.2.1 runtime and source release
    if: github.repository == 'Zerozero05/UI_Center' && github.ref == 'refs/tags/v1.2.1'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download the exact reviewed candidate from the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          if subprocess.check_output(['git', 'cat-file', '-t', 'refs/tags/v1.2.1'], text=True).strip() != 'tag':
              raise SystemExit('An annotated release tag is required')
          note = subprocess.check_output(['git', 'for-each-ref', '--format=%(contents)', 'refs/tags/v1.2.1'], text=True)
          matches = re.findall(r'^Candidate-Run: ([1-9][0-9]*)$', note, re.M)
          if len(matches) != 1:
              raise SystemExit('The approved annotated tag must identify one reviewed candidate run')
          pathlib.Path('candidate-run.txt').write_text(matches[0], encoding='utf-8')
          approved = {}
          for field, filename in [('Portable-SHA256', 'UI_Center_v1.2.1_Windows_x64_Portable.zip'),
                                  ('Single-SHA256', 'UI_Center_v1.2.1_Windows_x64.exe')]:
              values = re.findall(r'^' + field + r': ([0-9a-f]{64})$', note, re.M)
              if len(values) != 1:
                  raise SystemExit('The tag must bind one reviewed hash for ' + field)
              approved[filename] = values[0]
          pathlib.Path('candidate-approval.json').write_text(json.dumps(approved), encoding='utf-8')
          PY
          CANDIDATE_RUN=$(cat candidate-run.txt)
          test "$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN" --jq .head_sha)" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN" --jq .conclusion)" = success
          gh run download "$CANDIDATE_RUN" --name "windows-runtime-v1.2.1-$(git rev-parse HEAD)" --dir work/v1.2.1/release
          python3 - <<'PY'
          import hashlib, json, pathlib
          for name, digest in json.loads(pathlib.Path('candidate-approval.json').read_text()).items():
              if hashlib.sha256((pathlib.Path('work/v1.2.1/release') / name).read_bytes()).hexdigest() != digest:
                  raise SystemExit('Downloaded candidate differs from the reviewed tag hash: ' + name)
          PY
      - name: Prepare source snapshot, checksums and notes
        run: |
          python3 -B scripts/prepare_desktop_release.py --directory work/v1.2.1/release
          printf '\n已审阅运行包来源：[候选检查](https://github.com/%s/actions/runs/%s)。\n' "$GITHUB_REPOSITORY" "$(cat candidate-run.txt)" >> work/v1.2.1/release/release-notes.md
          printf '\n本次检查：[GitHub Actions](https://github.com/%s/actions/runs/%s)。\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> work/v1.2.1/release/release-notes.md
      - name: Create draft, verify public assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh --version
          gh release create v1.2.1 work/v1.2.1/release/UI_Center_v1.2.1_Windows_x64_Portable.zip work/v1.2.1/release/UI_Center_v1.2.1_Windows_x64.exe work/v1.2.1/release/UI_Center_v1.2.1_Source.zip work/v1.2.1/release/SHA256SUMS --verify-tag --draft --title v1.2.1 --notes-file work/v1.2.1/release/release-notes.md
          mkdir -p work/v1.2.1/release-download
          gh release download v1.2.1 --dir work/v1.2.1/release-download
          cmp work/v1.2.1/release/SHA256SUMS work/v1.2.1/release-download/SHA256SUMS
          (cd work/v1.2.1/release-download && sha256sum --check SHA256SUMS)
          gh release edit v1.2.1 --draft=false --latest
