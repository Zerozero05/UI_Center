plugins { id 'com.android.application' }
android {
    namespace 'cn.local.uicenter.demo'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'cn.local.uicenter.demo'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'cn.local.uicenter.demo.DemoSmoke'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main {
            // Components and the single token source are consumed without hand-maintained copies.
            java.srcDirs += rootProject.file('../../components/android/src/main/java')
            assets.srcDirs += rootProject.file('../../tokens')
        }
    }
}
// This demo has no third-party runtime or testing libraries.
